name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.14.14"

      - name: Lint check (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies and test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pytest-cov

      - name: Run test suite with coverage
        run: |
          python -m pytest -q \
            --cov=src/ragit \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  optional-backends:
    name: Optional Backend (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pgvector
            tests: tests/test_pgvector_store.py tests/test_pgvector_store_coverage.py tests/test_pgvector_strict_mode.py
          - extra: qdrant
            tests: tests/test_vector_backends.py tests/test_qdrant_coverage.py
          - extra: chroma
            tests: tests/test_vector_backends.py
          - extra: faiss
            tests: tests/test_vector_backends.py tests/test_faiss_coverage.py
          - extra: opentelemetry
            tests: tests/test_otel_bridge.py tests/test_telemetry_events.py
          - extra: object-storage
            tests: tests/test_object_connectors.py
          - extra: watch
            tests: tests/test_directory_connector.py
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and backend extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,${{ matrix.extra }}]"

      - name: Run backend tests
        run: python -m pytest -q ${{ matrix.tests }}

  build-and-verify:
    name: Build & Package Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  ci-success:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, optional-backends, build-and-verify]
    if: always()
    steps:
      - name: Evaluate pipeline results
        run: |
          if [ "${{ needs.lint-and-format.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.optional-backends.result }}" != "success" ] || \
             [ "${{ needs.build-and-verify.result }}" != "success" ]; then
            echo "CI pipeline failed"
            exit 1
          fi
          echo "All CI jobs completed successfully"
