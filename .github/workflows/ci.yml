name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q

  quality-and-build:
    name: Lint, format, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "ruff==0.14.14" build twine
      - name: Check lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*

  optional-vector-stores:
    name: Optional backend (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: pgvector
            tests: tests/test_pgvector_store.py tests/test_pgvector_store_coverage.py tests/test_pgvector_strict_mode.py
          - extra: qdrant
            tests: tests/test_vector_backends.py tests/test_qdrant_coverage.py
          - extra: chroma
            tests: tests/test_vector_backends.py
          - extra: faiss
            tests: tests/test_vector_backends.py tests/test_faiss_coverage.py
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package, test extras, and selected backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,${{ matrix.extra }}]"
      - name: Test selected backend
        run: python -m pytest -q ${{ matrix.tests }}
